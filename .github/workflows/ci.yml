name: CI

on:
  pull_request:
    branches: [dev, main]
  push:
    branches: [dev, main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

defaults:
  run:
    shell: bash

env:
  QT_QPA_PLATFORM: offscreen

jobs:
  build-and-test:
    name: Build and unit tests
    runs-on: ubuntu-24.04
    container: debian:trixie
    timeout-minutes: 15
    steps:
      - name: Install build tools
        run: |
          apt-get update
          apt-get install --yes --no-install-recommends \
            build-essential ca-certificates cmake dbus-daemon git ninja-build \
            libgmock-dev libgtest-dev python3 \
            qt6-base-dev qt6-declarative-dev qml6-module-qtquick \
            qml6-module-qtquick-window qml6-module-qttest fonts-dejavu-core

      - name: Check out the repository
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Test-only Python environment (cantools oracle, REQ-005)
        run: sh tools/setup_test_venv.sh

      - name: Print tool versions
        run: |
          g++ --version
          cmake --version
          ninja --version

      - name: Configure (debug with sanitizers)
        run: cmake --preset sanitizers --graphviz="$RUNNER_TEMP/link_graph.dot"

      - name: Service and HMI targets link to no concrete source (REQ-002)
        run: python3 tools/check_link_graph.py "$RUNNER_TEMP/link_graph.dot"

      - name: The HMI reaches past the view models nowhere (REQ-011)
        run: python3 tools/check_hmi_includes.py

      - name: The CAN code has no transmit call (REQ-001)
        run: python3 tools/check_can_read_only.py

      - name: Build (debug with sanitizers)
        run: cmake --build --preset sanitizers

      - name: Unit tests under AddressSanitizer and UndefinedBehaviorSanitizer
        run: ctest --preset sanitizers

      - name: Configure (release)
        run: cmake --preset release

      - name: Build (release)
        run: cmake --build --preset release

      - name: Unit tests (release)
        run: ctest --preset release

      - name: Every approved requirement has a tagged test or a measurement file
        run: python3 tools/check_traceability.py

  static-analysis:
    name: Static analysis
    runs-on: ubuntu-24.04
    container: debian:trixie
    timeout-minutes: 15
    steps:
      - name: Install analysis tools
        run: |
          apt-get update
          apt-get install --yes --no-install-recommends \
            build-essential ca-certificates clang clang-format clang-tidy cmake git \
            ninja-build libgmock-dev libgtest-dev python3 \
            qt6-base-dev qt6-declarative-dev qml6-module-qtquick \
            qml6-module-qtquick-window qml6-module-qttest fonts-dejavu-core

      - name: Check out the repository
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Mark the repository as safe for git
        run: git config --global --add safe.directory "$GITHUB_WORKSPACE"

      - name: Print tool versions
        run: |
          clang++ --version
          clang-format --version
          clang-tidy --version

      - name: Check formatting with clang-format
        run: |
          git ls-files '*.cpp' '*.h'
          git ls-files -z '*.cpp' '*.h' | xargs -0 --no-run-if-empty clang-format --style=file --dry-run --Werror

      - name: Configure (clang-tidy)
        run: cmake --preset static-analysis

      - name: Build with clang-tidy
        run: cmake --build --preset static-analysis

  arm64-release:
    name: arm64 release build
    runs-on: ubuntu-24.04-arm
    container: debian:trixie
    timeout-minutes: 25
    steps:
      - name: Install build tools
        run: |
          apt-get update
          apt-get install --yes --no-install-recommends \
            build-essential ca-certificates cmake dbus-daemon git ninja-build \
            libgmock-dev libgtest-dev python3 \
            qt6-base-dev qt6-declarative-dev qml6-module-qtquick \
            qml6-module-qtquick-window qml6-module-qttest fonts-dejavu-core

      - name: Check out the repository
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Test-only Python environment (cantools oracle, REQ-005)
        run: sh tools/setup_test_venv.sh

      - name: Record the architecture and the package versions the build used
        run: |
          mkdir -p "$RUNNER_TEMP/lexus-head-unit-arm64"
          {
            echo "machine: $(uname -m)"
            echo "os: $(. /etc/os-release && echo "$PRETTY_NAME")"
            dpkg-query --show --showformat='${Package} ${Version} ${Architecture}\n' \
              libc6 'libstdc++6' g++ cmake qt6-base-dev qt6-declarative-dev \
              'libqt6core6*' 'libqt6dbus6*' 'libqt6quick6*' 'libqt6qml6*'
          } | tee "$RUNNER_TEMP/lexus-head-unit-arm64/build_environment.txt"

      - name: Configure (release)
        run: cmake --preset release

      - name: Build (release)
        run: cmake --build --preset release

      - name: Unit tests (release, arm64)
        run: ctest --preset release

      - name: Collect the executables and the deployment files
        run: |
          build="$HOME/build/lexus-car-device/release"
          out="$RUNNER_TEMP/lexus-head-unit-arm64"
          for program in lexus-head-unit lexus-vehicle-data-service lexus-hub; do
            path="$(find "$build" -type f -name "$program" -perm -u+x | head -n 1)"
            test -n "$path" || { echo "missing: $program"; exit 1; }
            cp "$path" "$out/"
            file_type="$(od -An -tx1 -j18 -N2 "$out/$program" | tr -d ' ')"
            echo "$program: ELF machine $file_type (b700 is AArch64)"
            test "$file_type" = "b700"
          done
          cp -r deploy "$out/deploy"
          git rev-parse HEAD > "$out/commit.txt"
          ls -l "$out"

      - name: Upload the arm64 build
        uses: actions/upload-artifact@v7.0.1
        with:
          name: lexus-head-unit-arm64
          path: ${{ runner.temp }}/lexus-head-unit-arm64
          if-no-files-found: error
          retention-days: 30

  privacy-check:
    name: Privacy check
    runs-on: ubuntu-24.04
    container: debian:trixie
    timeout-minutes: 5
    steps:
      - name: Install git and Python
        run: |
          apt-get update
          apt-get install --yes --no-install-recommends ca-certificates git python3

      - name: Check out the repository
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Mark the repository as safe for git
        run: git config --global --add safe.directory "$GITHUB_WORKSPACE"

      - name: Unit tests of the privacy check
        run: python3 -m unittest discover --start-directory tools --pattern "test_*.py" --verbose

      - name: No VIN-shaped or Bluetooth-address-shaped string in tracked files
        run: python3 tools/check_private_data.py
