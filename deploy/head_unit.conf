# Lexus Head Unit configuration (DN-012). Lines are "key = value"; "#" starts a comment.
# Keys are read as "section.key". Missing keys keep the defaults shown here.

[source]
# elm327 (the adapter or the emulator), can (SocketCAN with the DBC), fake (scripted values)
kind = elm327

[elm327]
# The serial device: /dev/rfcomm0 on the Pi (deploy/bind_obd_adapter.sh), or the emulator's
# symlink at the desk (tools/elm327_emulator/elm327_emulator.py --link /tmp/obd).
device = /dev/rfcomm0
# One request's reply timeout. Link loss is declared when a reply times out and nothing has
# been heard from the adapter for link_loss_timeout_ms (REQ-008: 2 s).
reply_timeout_ms = 1000
link_loss_timeout_ms = 2000
# Pause between requests; 0 polls as fast as the adapter answers (rate measured on the car, LHU-017).
poll_interval_ms = 0
# Longest retry delay of the 1, 2, 4, 8 s schedule (REQ-008).
backoff_cap_ms = 10000
# Reply timeout of the supported-PID requests of the handshake: the adapter searches for the
# vehicle protocol on the first one, which can take several seconds (DN-042, assumption A18).
discovery_timeout_ms = 10000
# While connected: the adapter answers but no data has come for this long, so the ignition is
# off; the link is dropped and retried, and the strip says "Adapter found, no vehicle" (DN-042).
vehicle_silence_timeout_ms = 5000

[can]
# The SocketCAN interface (vcan0 on the Pi: deploy/setup_vcan.sh) and the DBC that describes it.
interface = vcan0
dbc = dbc/simulated_vehicle.dbc
# A silent bus for this long counts as a lost link (REQ-008); then 1, 2, 4, 8, 10 s retries.
link_loss_timeout_ms = 2000

[replay]
# source.kind = replay plays a recording back (DN-029): the file, and original (paced like the
# drive) or fast. Record with --record local_recordings/<name>.rec; scrub with
# tools/scrub_recording.py before a recording leaves local_recordings/.
file = local_recordings/drive.rec
timing = original

[staleness]
# A signal is Stale when no sample has arrived within its timeout (REQ-006).
default_ms = 1000
# Per-signal overrides: vehicle_speed_ms, engine_rpm_ms, coolant_temperature_ms, engine_load_ms,
# throttle_position_ms, intake_air_temperature_ms, control_module_voltage_ms, fuel_level_ms.
