# Lexus Head Unit hub registry (DN-021). Lines are "key = value"; "#" starts a comment.
# Read by: lexus-hub --registry deploy/hub.conf

[hub]
# The apps in grid order. Each id needs an [app.<id>] section below.
apps = vehicle_data
# Command line for url apps; {url} is replaced by the app's url. A separate profile directory
# keeps the launched browser a process of its own that the hub can track (assumption A10).
# Apps are started maximised rather than full screen so that the panel, with its Hub launcher,
# stays visible (assumption A11).
browser_command = chromium --user-data-dir=/tmp/lexus-hub-browser --start-maximized --app={url}
# Milliseconds between SIGTERM and SIGKILL when the hub stops an app.
stop_grace_ms = 3000

[app.vehicle_data]
name = Vehicle data
kind = native
# The vehicle-data app from the same build; on the Pi, the installed path (LHU-022).
command = lexus-head-unit --config deploy/head_unit.conf
restart = on-failure

# Web apps are url entries (LHU-023). Example, not enabled (add its id to hub.apps):
# [app.music]
# name = Music
# kind = url
# url = https://example.org
