# Lexus Head Unit hub registry (DN-021). Lines are "key = value"; "#" starts a comment.
# Read by: lexus-hub --registry deploy/hub.conf

[hub]
# The apps in grid order. Each id needs an [app.<id>] section below.
apps = vehicle_data, video, drm_check, game
# Command line for url apps (LHU-023); {url} is replaced by the app's url.
#   --ozone-platform=wayland  draw as a native Wayland client under labwc (D-045)
#   --user-data-dir, --disk-cache-dir  a profile of its own, so the launched browser stays the
#     process the hub tracks (assumption A10), in /tmp, which is RAM on the Pi image (A14)
#   --app={url}  one window with no tabs or address bar
#   --start-maximized  fills the screen except the panel, whose Hub launcher is the way back
#     (assumption A11); if that fails on the Pi, use --start-fullscreen with the labwc key binding
#   --no-first-run --noerrdialogs --password-store=basic  no dialogs a touch screen cannot answer
browser_command = chromium --ozone-platform=wayland --user-data-dir=/tmp/lexus-hub-browser --disk-cache-dir=/tmp/lexus-hub-browser-cache --no-first-run --noerrdialogs --password-store=basic --start-maximized --app={url}
# Milliseconds between SIGTERM and SIGKILL when the hub stops an app.
stop_grace_ms = 3000
# The firmware flags on the status strip (DN-025), read every power_poll_ms (REQ-020: 5 s).
power_command = vcgencmd get_throttled
power_poll_ms = 2000
# Run on the second tap of the shutdown button.
shutdown_command = systemctl poweroff
# Car mode only (DN-043, deploy/car/hub_car.conf): shutdown after the vehicle has gone quiet.
# Off at the desk.
ignition_off_shutdown_ms = 0

[app.vehicle_data]
name = Vehicle data
kind = native
# The vehicle-data app as a client of the vehicle-data service (DN-022), which systemd starts.
command = lexus-head-unit --source dbus
restart = on-failure

# Web apps are url entries (LHU-023). These three are the test set of
# docs/test/MANUAL_WEB_APPS_PROCEDURE.md: public pages that need no account. No account,
# password or cookie is ever written here.
[app.video]
name = Video
kind = url
url = https://commons.wikimedia.org/wiki/File:Big_Buck_Bunny_4K.webm

[app.drm_check]
name = DRM check
kind = url
url = https://bitmovin.com/demos/drm

[app.game]
name = Game
kind = url
url = https://play2048.co/
