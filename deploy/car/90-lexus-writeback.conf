# Car mode (LHU-044): the power bank can be unplugged at any moment. Write changed file data to
# the SD card within about 5 s instead of the default 30 s, so a power cut loses at most the
# last few seconds of the session log, the recording and the thermal log. The cost is more,
# smaller writes: a few kilobytes per second in a session.
vm.dirty_expire_centisecs = 500
vm.dirty_writeback_centisecs = 100
