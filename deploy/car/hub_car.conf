# Lexus Head Unit hub registry for car mode (LHU-044). Read by lexus-hub-session.
# Web apps (LHU-055) open in lexus-browser: Chromium full screen with a Hub button on every page
# that closes the window, which brings the hub back. The strip's Close button stops any app.

[hub]
apps = vehicle_data, map, youtube, spotify, screen_recording, demo_mode, car_mode, replay_last, pair_adapter
stop_grace_ms = 3000
# {url} is replaced by the app's url; deploy/car/lexus-browser explains every flag.
browser_command = lexus-browser {url}
power_command = vcgencmd get_throttled
power_poll_ms = 2000
shutdown_command = systemctl poweroff
# DN-043: after the vehicle has been live and then quiet (ignition off, adapter asleep) for this
# long, a 60 s countdown with Cancel runs, then the Pi shuts down cleanly. 0 turns it off.
ignition_off_shutdown_ms = 300000
shutdown_countdown_ms = 60000

[app.vehicle_data]
name = Vehicle data
kind = native
# The Hub button on its Home screen quits it, which brings the hub back.
command = lexus-head-unit --source dbus --fullscreen --hub-button --hide-pointer
restart = on-failure

[app.map]
name = Map
kind = native
# LHU-054: the phone's position on OpenStreetMap; its Hub button quits it, which brings the
# hub back. The position comes from the phone link (open the address on the hub in Safari).
command = lexus-map --fullscreen --hide-pointer
restart = on-failure

[app.youtube]
name = YouTube
kind = url
url = https://www.youtube.com/

# Plays only if Chromium on the Pi has the Widevine module (OQ-27, checklist step 3.20);
# otherwise the page says so and a Spotify Connect receiver is the fallback (DN-055).
[app.spotify]
name = Spotify
kind = url
url = https://open.spotify.com/

[app.demo_mode]
name = Demo mode
kind = native
command = lexus-mode demo
restart = never

[app.car_mode]
name = Car mode
kind = native
command = lexus-mode car
restart = never

[app.replay_last]
name = Replay last drive
kind = native
command = lexus-mode replay last
restart = never

[app.pair_adapter]
name = Pair adapter
kind = native
# Shows the pairing in a terminal on the touchscreen for 60 s after it ends; nothing to type.
command = lxterminal -e "lexus-pair-adapter --wait-at-end 60"
restart = never

[app.screen_recording]
name = Screen recording
kind = native
# LHU-049: turns recording on or off; remembered in car.conf across boots. While it records, the
# strip shows REC and the address line is hidden. Files: ~/lexus-data/screen/, one per session.
command = lexus-screen-record toggle
restart = never
